<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gachapon Lunch Picker 🎰</title>
    <!-- Confetti Particle Effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-accent: #ff4757;
            --primary-glow: rgba(255, 71, 87, 0.4);
            --bg-gradient: radial-gradient(circle at 50% 10%, #2f3640 0%, #111418 100%);
            --card-glass: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f5f6fa;
            --text-sub: #a4b0be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b81, #ffa502);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .main-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            max-width: 1050px;
            width: 100%;
        }

        /* Gachapon Machine Container */
        .machine-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .canvas-wrapper {
            position: relative;
            width: 320px;
            height: 380px;
        }

        #gachaCanvas {
            border-radius: 20px;
            background: radial-gradient(circle at 50% 30%, #1e272e 0%, #0f1418 100%);
            box-shadow: inset 0 0 25px rgba(0,0,0,0.8);
        }

        /* Action Button */
        .pick-btn {
            margin-top: 22px;
            padding: 16px 45px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 8px 25px var(--primary-glow);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pick-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px var(--primary-glow);
        }

        .pick-btn:disabled {
            background: #57606f;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Sidebar Section */
        .sidebar {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-panel {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 22px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .glass-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ff4757;
        }

        .btn-add {
            padding: 12px 20px;
            background: #2ed573;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover { background: #26af5f; }

        .btn-reset {
            background: rgba(255,255,255,0.1);
            color: var(--text-sub);
            border: 1px solid var(--card-border);
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-reset:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .food-tags {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .food-tag {
            background: rgba(255,255,255,0.08);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .food-tag .remove-btn {
            color: #ff6b81;
            cursor: pointer;
            font-weight: bold;
        }

        .history-tags {
            list-style: none;
            font-size: 0.9rem;
            color: var(--text-sub);
            max-height: 110px;
            overflow-y: auto;
        }

        .history-tags li {
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        /* Capsule Opening Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-body {
            background: #1e272e;
            border: 1px solid var(--card-border);
            padding: 35px 25px;
            border-radius: 28px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            animation: popIn 0.35s ease;
        }

        .capsule-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 25px auto;
        }

        .capsule-half {
            position: absolute;
            width: 110px;
            height: 55px;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .capsule-top {
            top: 0;
            border-radius: 55px 55px 0 0;
            box-shadow: inset -5px 5px 12px rgba(255,255,255,0.4), inset 5px -5px 12px rgba(0,0,0,0.5);
        }

        .capsule-bottom {
            bottom: 0;
            border-radius: 0 0 55px 55px;
            box-shadow: inset -5px -5px 12px rgba(0,0,0,0.6), inset 5px 5px 12px rgba(255,255,255,0.2);
        }

        .modal-overlay.open .capsule-top {
            transform: translateY(-45px) rotate(-20deg);
        }

        .modal-overlay.open .capsule-bottom {
            transform: translateY(45px) rotate(20deg);
        }

        .ticket-coupon {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 180px;
            padding: 12px;
            background: #ffeaa7;
            color: #2d3436;
            border: 2px dashed #fdcb6e;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transition: all 0.5s 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-break: break-word;
        }

        .modal-overlay.open .ticket-coupon {
            transform: translateX(-50%) scale(1.1);
            opacity: 1;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎰 Gachapon Lunch Picker</h1>
        <p>Drop the food balls, spin the drum, and open your lunch ticket!</p>
    </header>

    <div class="main-layout">
        <div class="machine-card">
            <div class="canvas-wrapper">
                <canvas id="gachaCanvas" width="320" height="380"></canvas>
            </div>
            <button class="pick-btn" id="pickBtn">PICK MY LUNCH!</button>
        </div>

        <div class="sidebar">
            <div class="glass-panel">
                <h2>
                    Food Options
                    <button class="btn-reset" id="resetBtn">Reset Default</button>
                </h2>
                <div class="input-box">
                    <input type="text" id="foodInput" placeholder="Add sushi, pizza, etc...">
                    <button class="btn-add" id="addBtn">Add</button>
                </div>
                <ul class="food-tags" id="foodTags"></ul>
            </div>

            <div class="glass-panel">
                <h2>History Log</h2>
                <ul class="history-tags" id="historyTags"></ul>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="revealModal">
        <div class="modal-body">
            <p style="color: var(--text-sub); text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;">Congratulations!</p>
            <h2 style="margin-top: 5px;">Your Lunch Ticket</h2>

            <div class="capsule-wrapper">
                <div class="capsule-half capsule-top" id="capsuleTop"></div>
                <div class="ticket-coupon" id="ticketText">Food Item</div>
                <div class="capsule-half capsule-bottom" id="capsuleBottom"></div>
            </div>

            <button class="pick-btn" id="closeModalBtn" style="margin-top: 20px; padding: 12px 35px; font-size: 1.1rem;">YUM! DECIDED</button>
        </div>
    </div>

    <script>
        const defaultFoods = ['Sushi 🍣', 'Pizza 🍕', 'Beef Noodles 🍜', 'Burger 🍔', 'Ramen 🍜', 'Korean BBQ 🥩', 'Tacos 🌮', 'Fried Chicken 🍗'];
        let foods = JSON.parse(localStorage.getItem('gacha_lunch_items')) || [...defaultFoods];
        let historyLog = [];

        const canvas = document.getElementById('gachaCanvas');
        const ctx = canvas.getContext('2d');
        const pickBtn = document.getElementById('pickBtn');
        const foodInput = document.getElementById('foodInput');
        const addBtn = document.getElementById('addBtn');
        const foodTags = document.getElementById('foodTags');
        const resetBtn = document.getElementById('resetBtn');
        const historyTags = document.getElementById('historyTags');
        const revealModal = document.getElementById('revealModal');
        const capsuleTop = document.getElementById('capsuleTop');
        const capsuleBottom = document.getElementById('capsuleBottom');
        const ticketText = document.getElementById('ticketText');
        const closeModalBtn = document.getElementById('closeModalBtn');

        const colorPalette = ['#ff4757', '#2ed573', '#ffa502', '#1e90ff', '#9b59b6', '#ff6b81', '#70a1ff', '#eccc68'];

        let balls = [];
        let isSpinning = false;
        let chuteBall = null;

        class GachaBall {
            constructor(label, color) {
                this.label = label;
                this.color = color;
                this.radius = 23;
                this.x = Math.random() * (220 - 2 * this.radius) + 50 + this.radius;
                this.y = Math.random() * (170 - 2 * this.radius) + 60 + this.radius;
                this.vx = (Math.random() - 0.5) * 3.5;
                this.vy = (Math.random() - 0.5) * 3.5;
            }

            update(speedMultiplier = 1) {
                this.x += this.vx * speedMultiplier;
                this.y += this.vy * speedMultiplier;

                const minX = 45 + this.radius;
                const maxX = 275 - this.radius;
                const minY = 55 + this.radius;
                const maxY = 245 - this.radius;

                if (this.x <= minX || this.x >= maxX) {
                    this.vx *= -1;
                    this.x = Math.max(minX, Math.min(maxX, this.x));
                }
                if (this.y <= minY || this.y >= maxY) {
                    this.vy *= -1;
                    this.y = Math.max(minY, Math.min(maxY, this.y));
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                const grad = ctx.createRadialGradient(
                    this.x - 7, this.y - 7, 2,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.25, this.color);
                grad.addColorStop(1, '#000000');
                
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const cleanText = this.label.replace(/[\u{1F600}-\u{1F64F}]/gu, '');
                const truncated = cleanText.length > 7 ? cleanText.substring(0, 6) + '..' : cleanText;
                ctx.fillText(truncated, this.x, this.y);
                ctx.restore();
            }
        }

        function initBalls() {
            balls = foods.map((food, i) => new GachaBall(food, colorPalette[i % colorPalette.length]));
        }

        function drawChamber() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.beginPath();
            ctx.roundRect(35, 45, 250, 215, 24);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(50, 60);
            ctx.lineTo(180, 60);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = '#0f1418';
            ctx.fillRect(125, 260, 70, 65);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.strokeRect(125, 260, 70, 65);

            ctx.fillStyle = '#2f3640';
            ctx.beginPath();
            ctx.arc(160, 325, 28, 0, Math.PI);
            ctx.fill();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawChamber();

            const speed = isSpinning ? 4.5 : 1;
            balls.forEach(ball => {
                ball.update(speed);
                ball.draw();
            });

            if (chuteBall) {
                chuteBall.y += 4.5;
                if (chuteBall.y > 325) chuteBall.y = 325;
                chuteBall.draw();
            }

            requestAnimationFrame(animate);
        }

        function spinLottery() {
            if (isSpinning || foods.length === 0) return;
            isSpinning = true;
            pickBtn.disabled = true;
            chuteBall = null;

            balls.forEach(b => {
                b.vx = (Math.random() - 0.5) * 14;
                b.vy = (Math.random() - 0.5) * 14;
            });

            setTimeout(() => {
                isSpinning = false;
                const winIndex = Math.floor(Math.random() * foods.length);
                const winnerFood = foods[winIndex];
                const winColor = colorPalette[winIndex % colorPalette.length];

                chuteBall = new GachaBall(winnerFood, winColor);
                chuteBall.x = 160;
                chuteBall.y = 260;

                setTimeout(() => {
                    triggerBallReveal(winnerFood, winColor);
                    pickBtn.disabled = false;
                }, 800);
            }, 2500);
        }

        function triggerBallReveal(food, color) {
            ticketText.innerText = food;
            capsuleTop.style.backgroundColor = color;
            capsuleBottom.style.backgroundColor = color;

            revealModal.classList.add('active');
            
            setTimeout(() => {
                revealModal.classList.add('open');
                
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            }, 100);

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            historyLog.unshift(`${timeStr} - ${food}`);
            renderHistory();
        }

        function renderTags() {
            foodTags.innerHTML = '';
            foods.forEach((food, index) => {
                const li = document.createElement('li');
                li.className = 'food-tag';
                li.innerHTML = `
                    ${food}
                    <span class="remove-btn" onclick="removeFood(${index})">&times;</span>
                `;
                foodTags.appendChild(li);
            });
            localStorage.setItem('gacha_lunch_items', JSON.stringify(foods));
            initBalls();
        }

        function addFood() {
            const val = foodInput.value.trim();
            if (val && !foods.includes(val)) {
                foods.push(val);
                foodInput.value = '';
                renderTags();
            }
        }

        window.removeFood = function(index) {
            foods.splice(index, 1);
            renderTags();
        };

        function renderHistory() {
            historyTags.innerHTML = historyLog.slice(0, 5).map(item => `<li>${item}</li>`).join('');
        }

        pickBtn.addEventListener('click', spinLottery);
        addBtn.addEventListener('click', addFood);
        foodInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addFood(); });

        resetBtn.addEventListener('click', () => {
            foods = [...defaultFoods];
            renderTags();
        });

        closeModalBtn.addEventListener('click', () => {
            revealModal.classList.remove('open');
            setTimeout(() => {
                revealModal.classList.remove('active');
            }, 300);
        });

        renderTags();
        animate();
    </script>
</body>
</html>
