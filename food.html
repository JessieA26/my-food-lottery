<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What To Eat Today? 🎰</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pastel-pink: #ffb7b2;
            --pastel-purple: #e2f0cb;
            --pastel-yellow: #ffdac1;
            --pastel-blue: #b5ead7;
            --pastel-lavender: #c7ceea;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.9);
            --text-dark: #4a4b6e;
            --accent-pink: #ff7675;
            --accent-hover: #e84393;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Quicksand', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            /* Dreamy Pastel Animated Mesh Gradient */
            background: linear-gradient(-45deg, #ffecd2, #fcb69f, #ff9a9e, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            color: #6c5ce7;
            text-shadow: 2px 2px 0px #ffffff;
            margin-bottom: 6px;
        }

        header p {
            color: #57606f;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        /* Gachapon Machine Card */
        .machine-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid var(--card-border);
            padding: 25px 30px;
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.25);
        }

        .canvas-container {
            position: relative;
            width: 320px;
            height: 390px;
        }

        #gachaCanvas {
            border-radius: 25px;
        }

        /* Turn Knob & Action Button */
        .pick-btn {
            margin-top: 15px;
            padding: 16px 42px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            background: linear-gradient(135deg, #ff7675, #d63031);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 118, 117, 0.4);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pick-btn:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(135deg, #e84393, #ff7675);
            box-shadow: 0 12px 25px rgba(232, 67, 147, 0.4);
        }

        .pick-btn:disabled {
            background: #b2bec3;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Sidebar Section */
        .sidebar {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid var(--card-border);
            padding: 22px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .glass-panel h2 {
            font-size: 1.25rem;
            color: #482ff7;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #dfe6e9;
            border-radius: 18px;
            color: var(--text-dark);
            outline: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: #6c5ce7;
        }

        .btn-add {
            padding: 12px 20px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add:hover { background: #55efc4; color: #2d3436; }

        .btn-reset {
            background: rgba(108, 92, 231, 0.1);
            color: #6c5ce7;
            border: 1px solid rgba(108, 92, 231, 0.2);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-reset:hover { background: #6c5ce7; color: #fff; }

        .food-tags {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .food-tag {
            background: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #2d3436;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .food-tag .remove-btn {
            color: #ff7675;
            cursor: pointer;
            font-weight: bold;
        }

        .history-tags {
            list-style: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: #636e72;
            max-height: 110px;
            overflow-y: auto;
        }

        .history-tags li {
            padding: 8px 0;
            border-bottom: 1px dashed #dfe6e9;
        }

        /* Japanese Gachapon Capsule Opening Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45, 52, 54, 0.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #ffffff;
            border: 4px solid #ffdac1;
            padding: 35px
