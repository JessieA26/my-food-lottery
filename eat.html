<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What To Eat Today? 🎰</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --pastel-pink: #ffb7b2;
            --pastel-purple: #e2f0cb;
            --pastel-yellow: #ffdac1;
            --pastel-blue: #b5ead7;
            --pastel-lavender: #c7ceea;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.95);
            --text-dark: #4a4b6e;
            --accent-pink: #ff7675;
            --accent-hover: #e84393;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Quicksand', 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ffecd2, #fcb69f, #ff9a9e, #a1c4fd, #c2e9fb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 800;
            color: #6c5ce7;
            text-shadow: 2px 2px 0px #ffffff;
            margin-bottom: 6px;
        }

        header p {
            color: #57606f;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        .machine-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid var(--card-border);
            padding: 25px 30px;
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.25);
        }

        .canvas-container {
            position: relative;
            width: 320px;
            height: 390px;
        }

        #gachaCanvas {
            border-radius: 25px;
            display: block;
        }

        .pick-btn {
            margin-top: 15px;
            padding: 16px 42px;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            background: linear-gradient(135deg, #ff7675, #d63031);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 118, 117, 0.4);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pick-btn:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(135deg, #e84393, #ff7675);
            box-shadow: 0 12px 25px rgba(232, 67, 147, 0.4);
        }

        .pick-btn:disabled {
            background: #b2bec3;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .sidebar {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid var(--card-border);
            padding: 22px;
            border-radius: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .glass-panel h2 {
            font-size: 1.25rem;
            color: #482ff7;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #dfe6e9;
            border-radius: 18px;
            color: var(--text-dark);
            outline: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: #6c5ce7;
        }

        .btn-add {
            padding: 12px 20px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-add:hover { background: #55efc4; color: #2d3436; }

        .btn-reset {
            background: rgba(108, 92, 231, 0.1);
            color: #6c5ce7;
            border: 1px solid rgba(108, 92, 231, 0.2);
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-reset:hover { background: #6c5ce7; color: #fff; }

        .food-tags {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .food-tag {
            background: #ffffff;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #2d3436;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }

        .food-tag .remove-btn {
            color: #ff7675;
            cursor: pointer;
            font-weight: bold;
        }

        .history-tags {
            list-style: none;
            font-size: 0.9rem;
            font-weight: 600;
            color: #636e72;
            max-height: 110px;
            overflow-y: auto;
        }

        .history-tags li {
            padding: 8px 0;
            border-bottom: 1px dashed #dfe6e9;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45, 52, 54, 0.6);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #ffffff;
            border: 4px solid #ffdac1;
            padding: 35px 25px;
            border-radius: 35px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            position: relative;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .capsule-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 25px auto;
        }

        .capsule-half {
            position: absolute;
            width: 120px;
            height: 60px;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .capsule-top {
            top: 0;
            border-radius: 60px 60px 0 0;
            box-shadow: inset -6px 6px 12px rgba(255,255,255,0.6), inset 6px -6px 12px rgba(0,0,0,0.2);
        }

        .capsule-bottom {
            bottom: 0;
            background: #ffffff !important;
            border-radius: 0 0 60px 60px;
            border-top: 3px solid #dfe6e9;
            box-shadow: inset -6px -6px 12px rgba(0,0,0,0.15);
        }

        .modal-overlay.open .capsule-top {
            transform: translateY(-50px) rotate(-25deg);
        }

        .modal-overlay.open .capsule-bottom {
            transform: translateY(50px) rotate(25deg);
        }

        .ticket-reveal {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 200px;
            padding: 15px 10px;
            background: #fff9e6;
            color: #d63031;
            border: 3px dashed #ffeaa7;
            border-radius: 16px;
            font-weight: 800;
            font-size: 1.35rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            opacity: 0;
            transition: all 0.5s 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            word-break: break-word;
        }

        .modal-overlay.open .ticket-reveal {
            transform: translateX(-50%) scale(1.05);
            opacity: 1;
        }

        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>What To Eat Today?</h1>
        <p>Turn the dial, release a mystery capsule, and pop open your food ticket!</p>
    </header>

    <div class="main-container">
        <div class="machine-card">
            <div class="canvas-container">
                <canvas id="gachaCanvas" width="320" height="390"></canvas>
            </div>
            <button class="pick-btn" id="pickBtn">
                <span>TURN GACHAPON!</span>
            </button>
        </div>

        <div class="sidebar">
            <div class="glass-panel">
                <h2>
                    Lunch Menu Options
                    <button class="btn-reset" id="resetBtn">Reset Default</button>
                </h2>
                <div class="input-group">
                    <input type="text" id="foodInput" placeholder="Add sushi, ramen, pizza...">
                    <button class="btn-add" id="addBtn">Add</button>
                </div>
                <ul class="food-tags" id="foodTags"></ul>
            </div>

            <div class="glass-panel">
                <h2>History Log</h2>
                <ul class="history-tags" id="historyTags"></ul>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="revealModal">
        <div class="modal-card">
            <p style="color: #a4b0be; text-transform: uppercase; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;">Mystery Gachapon Opened!</p>
            <h2 style="color: #2d3436; margin-top: 4px;">Today's Pick</h2>

            <div class="capsule-container">
                <div class="capsule-half capsule-top" id="capsuleTop"></div>
                <div class="ticket-reveal" id="ticketText">Food Item</div>
                <div class="capsule-half capsule-bottom" id="capsuleBottom"></div>
            </div>

            <button class="pick-btn" id="closeModalBtn" style="margin-top: 15px; width: 100%; justify-content: center; padding: 12px;">YUMMY! DECIDED</button>
        </div>
    </div>

    <script>
        // Polyfill Canvas roundRect for older browser compatibility
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, radii) {
                let r = Array.isArray(radii) ? radii[0] : (radii || 0);
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // Default Food Options
        const defaultFoods = ['Sushi 🍣', 'Pizza 🍕', 'Beef Noodles 🍜', 'Burger 🍔', 'Ramen 🍜', 'Korean BBQ 🥩', 'Tacos 🌮', 'Fried Chicken 🍗'];
        
        // Safe LocalStorage Reader
        function loadSavedFoods() {
            try {
                const saved = localStorage.getItem('japanese_gacha_lunch');
                return saved ? JSON.parse(saved) : [...defaultFoods];
            } catch (e) {
                return [...defaultFoods];
            }
        }

        function saveFoodsToStorage(data) {
            try {
                localStorage.setItem('japanese_gacha_lunch', JSON.stringify(data));
            } catch (e) {
                // Ignore storage permission block in restricted environments
            }
        }

        let foods = loadSavedFoods();
        let historyLog = [];

        // DOM Elements
        const canvas = document.getElementById('gachaCanvas');
        const ctx = canvas.getContext('2d');
        const pickBtn = document.getElementById('pickBtn');
        const foodInput = document.getElementById('foodInput');
        const addBtn = document.getElementById('addBtn');
        const foodTags = document.getElementById('foodTags');
        const resetBtn = document.getElementById('resetBtn');
        const historyTags = document.getElementById('historyTags');
        const revealModal = document.getElementById('revealModal');
        const capsuleTop = document.getElementById('capsuleTop');
        const ticketText = document.getElementById('ticketText');
        const closeModalBtn = document.getElementById('closeModalBtn');

        const capsuleColors = [
            '#ff7675', '#fd79a8', '#e84393', '#00b894', 
            '#0984e3', '#6c5ce7', '#fdcb6e', '#e17055'
        ];

        const globeCenter = { x: 160, y: 145 };
        const globeRadius = 110;
        const ballRadius = 18;

        let balls = [];
        let isSpinning = false;
        let chuteBall = null;

        class BlindGachaCapsule {
            constructor(foodLabel, color) {
                this.foodLabel = foodLabel;
                this.color = color;
                this.radius = ballRadius;
                
                const angle = Math.random() * Math.PI * 2;
                const r = Math.random() * (globeRadius - this.radius - 10);
                this.x = globeCenter.x + r * Math.cos(angle);
                this.y = globeCenter.y + r * Math.sin(angle);
                
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
            }

            update(speedMultiplier = 1) {
                this.x += this.vx * speedMultiplier;
                this.y += this.vy * speedMultiplier;

                const dx = this.x - globeCenter.x;
                const dy = this.y - globeCenter.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxAllowedDist = globeRadius - this.radius - 4;

                if (dist >= maxAllowedDist) {
                    const nx = dx / dist;
                    const ny = dy / dist;

                    const dot = this.vx * nx + this.vy * ny;
                    if (dot > 0) {
                        this.vx -= 2 * dot * nx;
                        this.vy -= 2 * dot * ny;
                    }

                    this.x = globeCenter.x + nx * maxAllowedDist;
                    this.y = globeCenter.y + ny * maxAllowedDist;
                }
            }

            draw() {
                ctx.save();
                
                // Bottom Half
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI, false);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                // Top Half
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, Math.PI, Math.PI * 2, false);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Seam Line
                ctx.beginPath();
                ctx.moveTo(this.x - this.radius, this.y);
                ctx.lineTo(this.x + this.radius, this.y);
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 3D Highlight
                ctx.beginPath();
                ctx.arc(this.x - 5, this.y - 6, 5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
                ctx.fill();

                ctx.restore();
            }
        }

        function initBalls() {
            balls = foods.map((food, i) => new BlindGachaCapsule(food, capsuleColors[i % capsuleColors.length]));
        }

        function drawJapaneseMachine() {
            // Machine Base
            ctx.fillStyle = '#ff7675';
            ctx.beginPath();
            ctx.roundRect(50, 230, 220, 145, [20]);
            ctx.fill();

            // Accent Stripe
            ctx.fillStyle = '#d63031';
            ctx.fillRect(50, 240, 220, 15);

            // Exit Chute
            ctx.fillStyle = '#2d3436';
            ctx.beginPath();
            ctx.arc(160, 325, 32, Math.PI, 0, false);
            ctx.fill();

            // Chute Tray
            ctx.fillStyle = '#636e72';
            ctx.beginPath();
            ctx.ellipse(160, 330, 36, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Turn Dial
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(160, 275, 24, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffeaa7';
            ctx.beginPath();
            ctx.arc(160, 275, 18, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#d63031';
            ctx.beginPath();
            ctx.roundRect(144, 271, 32, 8, [4]);
            ctx.fill();

            // Glass Globe
            ctx.beginPath();
            ctx.arc(globeCenter.x, globeCenter.y, globeRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Glass Reflection
            ctx.beginPath();
            ctx.arc(globeCenter.x, globeCenter.y, globeRadius - 10, -Math.PI * 0.75, -Math.PI * 0.25);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 6;
            ctx.stroke();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawJapaneseMachine();

            const speed = isSpinning ? 4.8 : 1;
            balls.forEach(ball => {
                ball.update(speed);
                ball.draw();
            });

            if (chuteBall) {
                chuteBall.y += 4;
                if (chuteBall.y > 325) chuteBall.y = 325;
                chuteBall.draw();
            }

            requestAnimationFrame(animate);
        }

        function spinGachapon() {
            if (isSpinning || foods.length === 0) return;
            isSpinning = true;
            pickBtn.disabled = true;
            chuteBall = null;

            balls.forEach(b => {
                b.vx = (Math.random() - 0.5) * 16;
                b.vy = (Math.random() - 0.5) * 16;
            });

            setTimeout(() => {
                isSpinning = false;
                const winIndex = Math.floor(Math.random() * foods.length);
                const selectedFood = foods[winIndex];
                const winningColor = capsuleColors[winIndex % capsuleColors.length];

                chuteBall = new BlindGachaCapsule(selectedFood, winningColor);
                chuteBall.x = 160;
                chuteBall.y = 285;

                setTimeout(() => {
                    revealTicket(selectedFood, winningColor);
                    pickBtn.disabled = false;
                }, 700);
            }, 2200);
        }

        function revealTicket(foodItem, color) {
            ticketText.innerText = foodItem;
            capsuleTop.style.backgroundColor = color;

            revealModal.classList.add('active');
            
            setTimeout(() => {
                revealModal.classList.add('open');
                
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 110,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }
            }, 100);

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            historyLog.unshift(`${timeStr} - ${foodItem}`);
            renderHistory();
        }

        function renderTags() {
            foodTags.innerHTML = '';
            foods.forEach((food, index) => {
                const li = document.createElement('li');
                li.className = 'food-tag';
                li.innerHTML = `
                    ${food}
                    <span class="remove-btn" onclick="removeFood(${index})">&times;</span>
                `;
                foodTags.appendChild(li);
            });
            saveFoodsToStorage(foods);
            initBalls();
        }

        function addFood() {
            const val = foodInput.value.trim();
            if (val && !foods.includes(val)) {
                foods.push(val);
                foodInput.value = '';
                renderTags();
            }
        }

        window.removeFood = function(index) {
            foods.splice(index, 1);
            renderTags();
        };

        function renderHistory() {
            historyTags.innerHTML = historyLog.slice(0, 5).map(item => `<li>${item}</li>`).join('');
        }

        // Event Listeners
        pickBtn.addEventListener('click', spinGachapon);
        addBtn.addEventListener('click', addFood);
        foodInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addFood(); });

        resetBtn.addEventListener('click', () => {
            foods = [...defaultFoods];
            renderTags();
        });

        closeModalBtn.addEventListener('click', () => {
            revealModal.classList.remove('open');
            setTimeout(() => {
                revealModal.classList.remove('active');
            }, 300);
        });

        // Initialize App
        renderTags();
        animate();
    </script>
</body>
</html>
